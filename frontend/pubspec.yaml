name: callbreak
description: "Call Break — multiplayer trick-taking card game with bot opponents."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  # "Now" as an injectable rather than a hard call to DateTime.now(), so the
  # turn clock can be wound forward in tests instead of waited out in real time.
  clock: ^1.1.1
  # The REST surface next to the socket (profile, history, statistics, offline
  # game upload). A plain client, injectable so tests can answer requests with
  # the literal JSON from `backend/docs/API.md` instead of a live server.
  http: ^1.6.0
  # The device id, the session token and the offline upload queue all have to
  # survive an app restart — the one thing the in-memory guest token never did.
  # No uuid package: `Random.secure` in `state/identity_store.dart` is the whole
  # of what v4 needs, and a dependency per function is a dependency too many.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Winds a hosted table's clocks forward, so a test does not sit through a
  # twenty-second turn timeout in real time.
  fake_async: ^1.3.1
  # Lets a test stand in for the native audio plugin (the platform-interface
  # pattern's own seam), to pin down how many native players the sound effects
  # create. Already resolved as a transitive dependency of audioplayers.
  audioplayers_platform_interface: ^7.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
